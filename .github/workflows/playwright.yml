# MJM Store — Playwright e2e on Chromium.
#
# DB: isolated MySQL service (mjm_store_test) -> prisma migrate deploy ->
# comprehensive seed (prisma/seed_all.ts: admin + categories + products +
# CMS + shipping, upserts only — no orders/payments touched).
# Servers are started automatically by playwright.config.ts webServer
# (backend start:dev + frontend dev -p 3002); they inherit this job's env.
#
# Admin specs: run FULL suite when ADMIN_EMAIL + ADMIN_PASSWORD secrets are
# set (passed through to global-setup; values stay masked). When missing,
# only the public subset runs (smoke/public/catalog/errors) with an explicit
# notice — admin specs are skipped loudly, never silently.
# Real failures fail the job. Secrets never appear in logs or artifacts.

name: playwright

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-chromium:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          # Lets the service start when the secret is missing so the
          # "Validate required secrets" step below can fail LOUDLY with the
          # missing names. No real password here; CI uses mjm_store_test only.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: mjm_store_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot --password=$MYSQL_ROOT_PASSWORD"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST != '' && secrets.DATABASE_URL_TEST || format('mysql://root:{0}@127.0.0.1:3306/mjm_store_test', secrets.DB_ROOT_PASSWORD) }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      FRONTEND_URL: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate required secrets (names only)
        run: |
          missing=""
          [ -z "${{ secrets.DB_ROOT_PASSWORD }}" ] && [ -z "${{ secrets.DATABASE_URL_TEST }}" ] && missing="$missing DB_ROOT_PASSWORD(or DATABASE_URL_TEST)"
          [ -z "${{ secrets.JWT_SECRET }}" ] && missing="$missing JWT_SECRET"
          [ -z "${{ secrets.JWT_REFRESH_SECRET }}" ] && missing="$missing JWT_REFRESH_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing — see CI_TESTING_GUIDE.md"
            exit 1
          fi

      - name: Install backend + frontend (npm ci)
        run: |
          npm ci --prefix ../backend
          npm ci

      - name: Migrate + seed test DB (mjm_store_test only)
        working-directory: ./backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx ts-node -r dotenv/config prisma/seed_all.ts

      - name: Install Chromium (browser only)
        run: npx playwright install --with-deps chromium

      # NOTE: the `secrets` context is not allowed in step `if` conditions
      # (invalid workflow file). The admin secrets are already mirrored to
      # job env (PLAYWRIGHT_ADMIN_*), so gate on `env` instead.
      - name: Playwright full suite (admin secrets present)
        if: env.PLAYWRIGHT_ADMIN_EMAIL != '' && env.PLAYWRIGHT_ADMIN_PASSWORD != ''
        run: npx playwright test --project=chromium --reporter=list,html

      - name: Playwright public-only (ADMIN_* missing — admin specs skipped loudly)
        if: env.PLAYWRIGHT_ADMIN_EMAIL == '' || env.PLAYWRIGHT_ADMIN_PASSWORD == ''
        run: |
          echo "::notice::ADMIN_EMAIL/ADMIN_PASSWORD not set — running public subset only (smoke, public, catalog, errors). Admin specs skipped, not failed."
          npx playwright test --project=chromium --reporter=list,html tests/smoke tests/public tests/catalog tests/errors

      - name: Upload playwright-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
